<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFA Agents Wiki</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            min-height: 90vh;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            grid-column: 1 / -1;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 2em;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .lang-switcher {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: white;
            color: #667eea;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 8px 15px;
            border: 2px solid white;
            border-radius: 4px;
            font-size: 1em;
            width: 250px;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-box button {
            background: white;
            border: none;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            width: 100%;
        }

        .sidebar {
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
            padding: 20px;
        }

        .sidebar h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #333;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: block;
            padding: 8px 12px;
            color: #667eea;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .sidebar a:hover {
            background: #e0e0e0;
            padding-left: 16px;
        }

        .sidebar a.active {
            background: #667eea;
            color: white;
            font-weight: bold;
            padding-left: 16px;
        }

        .content-area {
            padding: 40px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .content-area h1 {
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .content-area h2 {
            color: #667eea;
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .content-area h3 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .content-area p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .content-area ul,
        .content-area ol {
            margin-left: 30px;
            margin-bottom: 15px;
        }

        .content-area li {
            color: #555;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .content-area code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d63384;
        }

        .content-area pre {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .content-area pre code {
            color: #333;
            background: none;
            padding: 0;
        }

        .content-area blockquote {
            border-left: 4px solid #667eea;
            padding-left: 15px;
            margin-left: 0;
            margin-bottom: 15px;
            color: #666;
            font-style: italic;
        }

        .content-area a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 1px dotted #667eea;
            transition: all 0.2s;
        }

        .content-area a:hover {
            color: #764ba2;
            border-bottom-style: solid;
        }

        .content-area table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .content-area th,
        .content-area td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .content-area th {
            background: #667eea;
            color: white;
        }

        .content-area tr:nth-child(even) {
            background: #f9f9f9;
        }

        cite {
            display: block;
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }

        cite strong {
            color: #667eea;
        }

        .no-content {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .breadcrumb {
            margin-bottom: 20px;
            color: #999;
            font-size: 0.9em;
        }

        .breadcrumb a {
            color: #667eea;
            cursor: pointer;
        }

        .breadcrumb a:hover {
            color: #764ba2;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 300px;
            }

            .content-area {
                max-height: 100%;
            }

            .search-box input {
                width: 150px;
            }

            header h1 {
                font-size: 1.5em;
            }

            .header-controls {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .language-info {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <header>
                <h1>📘 TFA Agents Wiki</h1>
                <div class="header-controls">
                    <div class="lang-switcher">
                        <button class="lang-btn active" data-lang="en">English</button>
                        <button class="lang-btn" data-lang="it">Italiano</button>
                    </div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Cerca...">
                        <button onclick="performSearch()">Cerca</button>
                    </div>
                </div>
            </header>

            <div class="sidebar" id="sidebar">
                <!-- Generato dinamicamente -->
            </div>

            <div class="content-area" id="content">
                <div class="no-content">Seleziona un articolo dal menu a sinistra</div>
            </div>
        </div>
    </div>

    <script>
        const WIKI_STRUCTURE = {
            en: {
                'project-overview': { title: 'Project Overview', category: 'Getting Started' },
                'getting-started': { title: 'Getting Started', category: 'Getting Started' },
                'development-guidelines': { title: 'Development Guidelines', category: 'Development' },
                'build-deployment': { title: 'Build and Deployment', category: 'Development' },
                'troubleshooting': { title: 'Troubleshooting', category: 'Support' },
                'architecture': { title: 'Architecture Overview', category: 'Architecture' },
                'core-systems': { title: 'Core Systems', category: 'Systems' },
                'api-reference': { title: 'API Reference', category: 'Reference' },
                'addons': { title: 'Addons and Development Tools', category: 'Tools' },
                'game-maps': { title: 'Game Maps and Levels', category: 'Gameplay' },
                'visual-effects': { title: 'Visual Effects and Graphics', category: 'Graphics' }
            },
            it: {
                'project-overview': { title: 'Panoramica Progetto', category: 'Introduzione' },
                'getting-started': { title: 'Guida Introduttiva', category: 'Introduzione' },
                'development-guidelines': { title: 'Linee Guida Sviluppo', category: 'Sviluppo' },
                'build-deployment': { title: 'Build e Deployment', category: 'Sviluppo' },
                'troubleshooting': { title: 'Risoluzione Problemi', category: 'Supporto' },
                'architecture': { title: 'Panoramica Architettura', category: 'Architettura' },
                'core-systems': { title: 'Sistemi Core', category: 'Sistemi' },
                'api-reference': { title: 'Riferimento API', category: 'Riferimento' },
                'addons': { title: 'Componenti Aggiuntivi e Strumenti', category: 'Strumenti' },
                'game-maps': { title: 'Mappe Gioco e Livelli', category: 'Gameplay' },
                'visual-effects': { title: 'Effetti Visivi e Grafica', category: 'Grafica' }
            }
        };

        const CONTENT_FILES = {
            en: {
                'project-overview': 'content/Project Overview.md',
                'getting-started': 'content/Getting Started.md',
                'development-guidelines': 'content/Development Guidelines.md',
                'build-deployment': 'content/Build and Deployment.md',
                'troubleshooting': 'content/Troubleshooting.md',
            },
            it: {
                'project-overview': 'content/Panoramica Progetto.md',
                'getting-started': 'content/Guida Introduttiva.md',
                'development-guidelines': 'content/Linee Guida Sviluppo.md',
                'build-deployment': 'content/Build e Deployment.md',
                'troubleshooting': 'content/Risoluzione Problemi.md',
            }
        };

        let currentLang = 'en';
        let currentPage = 'project-overview';
        let contentCache = {};

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentLang = e.target.dataset.lang;
                renderSidebar();
                loadPage(currentPage);
            });
        });

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            const structure = WIKI_STRUCTURE[currentLang];
            const categories = {};

            Object.entries(structure).forEach(([key, value]) => {
                if (!categories[value.category]) {
                    categories[value.category] = [];
                }
                categories[value.category].push({ key, ...value });
            });

            Object.entries(categories).forEach(([category, items]) => {
                const categoryTitle = document.createElement('h3');
                categoryTitle.textContent = category;
                sidebar.appendChild(categoryTitle);

                items.forEach(item => {
                    const link = document.createElement('a');
                    link.textContent = item.title;
                    link.href = '#';
                    link.dataset.page = item.key;
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        loadPage(item.key);
                    });
                    if (item.key === currentPage) {
                        link.classList.add('active');
                    }
                    sidebar.appendChild(link);
                });
            });
        }

        async function loadPage(pageKey) {
            currentPage = pageKey;
            const content = document.getElementById('content');

            // Aggiorna link attivi nella sidebar
            document.querySelectorAll('#sidebar a').forEach(a => {
                a.classList.remove('active');
                if (a.dataset.page === pageKey) {
                    a.classList.add('active');
                }
            });

            const filePath = CONTENT_FILES[currentLang][pageKey];
            if (!filePath) {
                content.innerHTML = '<div class="no-content">Articolo non disponibile</div>';
                return;
            }

            try {
                // In un vero progetto, caricheremmo dal server
                // Per ora, mostriamo un messaggio
                if (!contentCache[currentLang]) {
                    contentCache[currentLang] = {};
                }

                if (contentCache[currentLang][pageKey]) {
                    const markdown = contentCache[currentLang][pageKey];
                    const html = marked.parse(markdown);
                    content.innerHTML = DOMPurify.sanitize(html);
                } else {
                    const pageTitle = WIKI_STRUCTURE[currentLang][pageKey].title;
                    content.innerHTML = `
                        <div class="language-info">
                            📖 Articolo: <strong>${pageTitle}</strong>
                        </div>
                        <p>Il contenuto è disponibile nei file markdown nella cartella <code>repowiki/${currentLang}/content/</code></p>
                        <h2>Struttura Wiki Creata</h2>
                        <ul>
                            <li><strong>Lingua Inglese (EN):</strong> repowiki/en/content/</li>
                            <li><strong>Lingua Italiana (IT):</strong> repowiki/it/content/</li>
                        </ul>
                        <h2>Come usare questa Wiki</h2>
                        <ol>
                            <li>Clicca sui titoli nel menu laterale sinistro per navigare tra gli articoli</li>
                            <li>Usa il selettore lingua (en/it) in alto a destra per cambiare lingua</li>
                            <li>La ricerca è disponibile nel box in alto</li>
                            <li>I file markdown vengono caricati da: <code>.vscode/repowiki/[lingua]/content/</code></li>
                        </ol>
                        <h2>File Disponibili</h2>
                        <ul>
                            <li>Panoramica Progetto / Project Overview</li>
                            <li>Guida Introduttiva / Getting Started</li>
                            <li>Linee Guida Sviluppo / Development Guidelines</li>
                            <li>Build e Deployment / Build and Deployment</li>
                            <li>Risoluzione Problemi / Troubleshooting</li>
                        </ul>
                    `;
                }
            } catch (error) {
                content.innerHTML = `<div class="no-content">Errore nel caricamento: ${error.message}</div>`;
            }
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (!searchTerm) return;

            const results = [];
            Object.entries(WIKI_STRUCTURE[currentLang]).forEach(([key, value]) => {
                if (value.title.toLowerCase().includes(searchTerm)) {
                    results.push({ key, ...value });
                }
            });

            if (results.length > 0) {
                loadPage(results[0].key);
            } else {
                document.getElementById('content').innerHTML =
                    '<div class="no-content">Nessun risultato trovato per: ' + searchTerm + '</div>';
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Inizializzazione
        renderSidebar();
        loadPage('project-overview');
    </script>
</body>
</html>
